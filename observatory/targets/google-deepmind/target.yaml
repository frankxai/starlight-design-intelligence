$schema: ../../../schemas/design-research-target.schema.json
schema_version: starlight.design_research_target.v1
target_id: google-deepmind
display_name: Google DeepMind
source_owner: Google DeepMind
canonical_url: https://deepmind.google/
why: Scientific editorial systems, breakthrough narratives, and high-craft media
  pacing.
capture_policy:
