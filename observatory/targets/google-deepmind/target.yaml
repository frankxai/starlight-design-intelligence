    kind: product-overview
    url: https://deepmind.google/research/
    route: /research/
  - surface_id: feature
    kind: feature
    url: https://deepmind.google/models/gemini/
    route: /models/gemini/
  - surface_id: pricing
    kind: conversion
    url: https://deepmind.google/careers/
    route: /careers/
  - surface_id: proof
    kind: proof
    url: https://deepmind.google/blog/
    route: /blog/
rights:
  state: third-party-reference-only
  allowed_use: Abstract research findings and original pattern synthesis only.
  prohibited_use: Marks, assets, font files, source code, distinctive
    compositions, and copied components.
  reviewed_at: 2026-09-02
