anti_patterns:
  - finding_id: anthropic.anti.unavailable-route
    kind: observed
    statement: "One or more selected public routes returned missing or empty
      content: product-overview."
    confidence: 0.99
    evidence_snapshot_ids:
      - snapshot.anthropic.product-overview.browser-observed.20260902t210300z
    data:
      affected_surfaces:
        - surface_id: product-overview
          page_state: empty-content
    rights_safe_abstraction: true
  - finding_id: anthropic.anti.density-risk
    kind: inferred
    statement: Large inventories of equal-weight links or cards can obscure the
      primary decision when hierarchy does not visibly narrow the next action.
    confidence: 0.55
    evidence_snapshot_ids: *a1
    rights_safe_abstraction: true
