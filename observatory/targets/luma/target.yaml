$schema: ../../../schemas/design-research-target.schema.json
schema_version: starlight.design_research_target.v1
target_id: luma
display_name: Luma
source_owner: Luma
canonical_url: https://lu.ma/
why: Event discovery, lightweight creation flows, and trust through hosted
  detail pages.
capture_policy:
  locales:
    - en-US
  freshness_days: 90
  viewports:
    - name: desktop-1440
      width: 1440
      height: 1000
      dpr: 1
    - name: mobile-390
      width: 390
      height: 844
      dpr: 1
    - name: reflow-320
      width: 320
      height: 720
      dpr: 1
  raw_storage: private-r2-content-addressed
surfaces:
  - surface_id: homepage
    kind: homepage
    url: https://lu.ma/
    route: /
  - surface_id: product-overview
    kind: product-overview
    url: https://lu.ma/create
    route: /create
  - surface_id: feature
    kind: feature
    url: https://lu.ma/discover
    route: /discover
  - surface_id: pricing
    kind: conversion
    url: https://lu.ma/pricing
    route: /pricing
  - surface_id: proof
    kind: proof
    url: https://luma.com/design
    route: /design
rights:
  state: third-party-reference-only
  allowed_use: Abstract research findings and original pattern synthesis only.
  prohibited_use: Marks, assets, font files, source code, distinctive
    compositions, and copied components.
  reviewed_at: 2026-09-02
