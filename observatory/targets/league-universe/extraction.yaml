anti_patterns:
  - finding_id: league-universe.anti.unavailable-route
    kind: observed
    statement: "One or more selected public routes returned missing or empty
      content: homepage, product-overview."
    confidence: 0.99
    evidence_snapshot_ids:
      - snapshot.league-universe.homepage.browser-observed.20260902t211534z
      - snapshot.league-universe.product-overview.browser-observed.20260902t211547z
    data:
      affected_surfaces:
        - surface_id: homepage
          page_state: not-found-content
        - surface_id: product-overview
          page_state: not-found-content
    rights_safe_abstraction: true
  - finding_id: league-universe.anti.density-risk
    kind: inferred
    statement: Large inventories of equal-weight links or cards can obscure the
      primary decision when hierarchy does not visibly narrow the next action.
    confidence: 0.55
    evidence_snapshot_ids: *a1
    rights_safe_abstraction: true
category_saturation:
  - finding_id: league-universe.saturation.category
    kind: inferred
    statement: Dark gradients, oversized declarative headlines, pill controls, logo
      walls, and undifferentiated feature-card grids are highly saturated across
      the reference category.
    confidence: 0.63
    evidence_snapshot_ids: *a1
    rights_safe_abstraction: true
