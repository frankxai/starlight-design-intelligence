$schema: ../../../schemas/design-research-target.schema.json
schema_version: starlight.design_research_target.v1
target_id: league-universe
display_name: League of Legends Universe
source_owner: Riot Games, Inc.
canonical_url: https://universe.leagueoflegends.com/en_US/
why: World-system navigation, cinematic lore, and character-led discovery.
capture_policy:
  locales:
    - en-US
  freshness_days: 90
  viewports:
    - name: desktop-1440
      width: 1440
      height: 1000
      dpr: 1
    - name: mobile-390
      width: 390
      height: 844
      dpr: 1
    - name: reflow-320
      width: 320
      height: 720
      dpr: 1
  raw_storage: private-r2-content-addressed
surfaces:
  - surface_id: homepage
    kind: homepage
    url: https://universe.leagueoflegends.com/en_US/
    route: /en_US/
  - surface_id: product-overview
    kind: product-overview
    url: https://universe.leagueoflegends.com/en_US/champions/
    route: /en_US/champions/
  - surface_id: feature
    kind: feature
    url: https://universe.leagueoflegends.com/en_US/regions/
    route: /en_US/regions/
  - surface_id: pricing
    kind: conversion
    url: https://universe.leagueoflegends.com/en_US/comic/
    route: /en_US/comic/
  - surface_id: proof
    kind: proof
    url: https://universe.leagueoflegends.com/en_US/explore/everything/newest/
    route: /en_US/explore/everything/newest/
rights:
  state: third-party-reference-only
  allowed_use: Abstract research findings and original pattern synthesis only.
  prohibited_use: Marks, assets, font files, source code, distinctive
    compositions, and copied components.
  reviewed_at: 2026-09-02
