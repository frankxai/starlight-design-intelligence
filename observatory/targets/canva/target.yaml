    kind: product-overview
    url: https://www.canva.com/features/
    route: /features/
  - surface_id: feature
    kind: feature
    url: https://www.canva.com/ai-image-generator/
    route: /ai-image-generator/
  - surface_id: pricing
    kind: conversion
    url: https://www.canva.com/pricing/
    route: /pricing/
  - surface_id: proof
    kind: proof
    url: https://www.canva.com/case-studies/
    route: /case-studies/
rights:
  state: third-party-reference-only
  allowed_use: Abstract research findings and original pattern synthesis only.
  prohibited_use: Marks, assets, font files, source code, distinctive
    compositions, and copied components.
  reviewed_at: 2026-09-02
