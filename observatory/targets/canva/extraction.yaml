    kind: inferred
    statement: Dark gradients, oversized declarative headlines, pill controls, logo
      walls, and undifferentiated feature-card grids are highly saturated across
      the reference category.
    confidence: 0.63
    evidence_snapshot_ids: *a1
    rights_safe_abstraction: true
