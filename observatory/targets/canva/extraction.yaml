  components:
    - finding_id: canva.components.observed
      kind: observed
      statement: "Public surfaces exposed repeated navigation and action labels
        including: our cookie policy; Accept all cookies; Reject all cookies;
        Manage cookies; Skip to main content; Canva home."
      confidence: 0.86
      evidence_snapshot_ids: *a1
      data:
        sampled_action_labels: &a2
          - our cookie policy
          - Accept all cookies
          - Reject all cookies
          - Manage cookies
          - Skip to main content
          - Canva home
          - Design
          - Product
          - Plans
          - Business
      rights_safe_abstraction: true
  page_anatomy:
    - finding_id: canva.anatomy.observed
      kind: observed
      statement: The selected set covers homepage, product/category overview, feature,
        conversion, and proof roles; 5 of five returned usable page content.
      confidence: 0.98
      evidence_snapshot_ids: *a1
      data:
        surfaces:
          - surface_id: homepage
            title: "Canva: Visual Suite for Everyone"
            page_state: loaded
            scroll_height: 7532
          - surface_id: product-overview
            title: Explore Canva Features to Unlock Your Creativity
            page_state: loaded
            scroll_height: 8930
          - surface_id: feature
            title: "Free AI Image Generator: Text to Image | Canva"
            page_state: loaded
            scroll_height: 9858
          - surface_id: pricing
            title: "Canva Pricing: Compare Free, Pro, Business and Enterprise plans"
            page_state: loaded
            scroll_height: 6612
          - surface_id: proof
            title: Canva customer case studies
            page_state: loaded
            scroll_height: 5482
      rights_safe_abstraction: true
  content_hierarchy:
    - finding_id: canva.hierarchy.observed
      kind: observed
      statement: "The captured hierarchy starts from explicit page headings such as:
        What will you design today?; Tools to power your best work; Turn your
        image into an editable layout with Magic Layers; Clean up photos with
        Magic Eraser."
      confidence: 0.9
      evidence_snapshot_ids: *a1
      data:
        sampled_headings:
          - What will you design today?
          - Tools to power your best work
          - Turn your image into an editable layout with Magic Layers
          - Clean up photos with Magic Eraser
          - Remove image and video backgrounds in one click
          - Elevate your writing with Magic Write
          - Create presentations that engage and inspire
          - Find your perfect presentation template
          - Stay on-brand with Brand Kit
          - Bring your presentations to life with animations
      rights_safe_abstraction: true
  cta_behavior:
    - finding_id: canva.cta.inferred
      kind: inferred
      statement: Repeated action labels suggest a persistent path from explanation
        toward a bounded signup, purchase, or sales action; click outcomes were
        not exercised in this pass.
      confidence: 0.66
      evidence_snapshot_ids: *a1
      data:
        sampled_action_labels: *a2
      rights_safe_abstraction: true
