$schema: ../../../schemas/design-research-target.schema.json
schema_version: starlight.design_research_target.v1
target_id: cosmos
display_name: Cosmos
source_owner: Cosmos
canonical_url: https://www.cosmos.so/
why: Image-first discovery, low-chrome interaction, and collection-based navigation.
capture_policy:
  locales:
    - en-US
  freshness_days: 90
  viewports:
    - name: desktop-1440
      width: 1440
      height: 1000
      dpr: 1
    - name: mobile-390
      width: 390
      height: 844
      dpr: 1
    - name: reflow-320
      width: 320
      height: 720
      dpr: 1
  raw_storage: private-r2-content-addressed
surfaces:
  - surface_id: homepage
    kind: homepage
    url: https://www.cosmos.so/
    route: /
  - surface_id: product-overview
    kind: product-overview
    url: https://www.cosmos.so/explore
    route: /explore
  - surface_id: feature
    kind: feature
    url: https://help.cosmos.so/en/collections/9545884-getting-started
    route: /en/collections/9545884-getting-started
  - surface_id: pricing
    kind: conversion
    url: https://www.cosmos.so/signup
    route: /signup
  - surface_id: proof
    kind: proof
    url: https://www.cosmos.so/careers
    route: /careers
rights:
  state: third-party-reference-only
  allowed_use: Abstract research findings and original pattern synthesis only.
  prohibited_use: Marks, assets, font files, source code, distinctive
    compositions, and copied components.
  reviewed_at: 2026-09-02
