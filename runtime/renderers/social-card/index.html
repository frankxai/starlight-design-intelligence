<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FrankX Social Card — Liquid Glass + World-Class Taste</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap');
    
    body { margin:0; padding:40px; background:#0a0a0b; font-family:Inter, system-ui; color:#e2e8f0; }
    
    .card {
      width: 1080px; height: 1080px;
      background: linear-gradient(145deg, #111113 0%, #0a0a0b 100%);
      border: 1px solid #1e1e1e;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 40px 120px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px;
    }
    
    .glass {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
    }
    
    .header { font-family: Poppins, system-ui; font-size: 42px; font-weight: 700; line-height: 1.1; }
    .sub { font-size: 22px; opacity: 0.85; margin-top: 12px; }
    
    .body { font-size: 28px; line-height: 1.35; max-width: 860px; }
    
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 18px; opacity: 0.7;
    }
    
    .accent { color: #10b981; }
    .soul { color: #f59e0b; }
    
    .signal { position: absolute; top: 0; right: 0; width: 180px; height: 180px; 
               background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%); }
  </style>
</head>
<body>
  <div class="card" id="social-card">
    <div>
      <div class="glass">
        <div class="header">Command Layer.<br>Owned Systems.</div>
        <div class="sub">FrankX • 2026</div>
      </div>
    </div>
    
    <div class="body">
      Turn AI capability into <span class="accent">leverage</span>,<br>
      products, and revenue loops.<br>
      No hype. Mechanisms only.
    </div>
    
    <div class="footer glass">
      <div>frankx.ai</div>
      <div class="soul">Authority • Systems • Outcomes</div>
    </div>
    
    <div class="signal"></div>
  </div>
  
  <script>
    // Ready for Playwright/Satori capture or manual export
    console.log('FrankX liquid glass social card ready. Use as template or feed to renderer.');
  </script>
</body>
</html>
