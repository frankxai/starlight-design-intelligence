name: Design kernel

on:
  pull_request:
    paths:
      - ".agent-harness.json"
      - ".github/workflows/design-contract.yml"
      - ".github/workflows/design-kernel.yml"
      - "brand-image-system/**"
      - "brand-packs/**"
      - "evals/**"
      - "playbooks/**"
      - "portfolio/**"
      - "schemas/**"
      - "scripts/**"
      - "skills/**"
      - "templates/**"
      - "tests/**"
      - "AGENTS.md"
      - "DESIGN.md"
      - "DESIGN_AGENT_OPERATING_SYSTEM.md"
      - "README.md"
      - "RUNBOOK.md"
      - "SECURITY.md"
      - "SKILLS.md"
      - "SKILLS_BRIDGE.md"
      - "SYSTEM.md"
      - "SCHEMA.md"
      - "TESTING.md"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: design-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
