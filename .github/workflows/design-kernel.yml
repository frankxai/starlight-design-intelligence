name: Design kernel

on:
  pull_request:
    paths:
      - ".agent-harness.json"
      - ".github/workflows/design-contract.yml"
      - ".github/workflows/design-kernel.yml"
      - "brand-image-system/**"
      - "brand-packs/**"
      - "evals/**"
      - "playbooks/**"
      - "portfolio/**"
      - "schemas/**"
      - "scripts/**"
      - "skills/**"
      - "templates/**"
      - "tests/**"
      - "AGENTS.md"
      - "DESIGN.md"
      - "DESIGN_AGENT_OPERATING_SYSTEM.md"
      - "README.md"
      - "RUNBOOK.md"
      - "SECURITY.md"
      - "SKILLS.md"
      - "SKILLS_BRIDGE.md"
      - "SYSTEM.md"
      - "SCHEMA.md"
      - "TESTING.md"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: design-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
