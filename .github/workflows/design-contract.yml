name: Starlight design contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  design-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out caller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: downstream
          persist-credentials: false
          fetch-depth: 0
      - name: Check out immutable design kernel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: frankxai/starlight-design-intelligence
          ref: ${{ job.workflow_sha }}
          path: kernel
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: kernel/package-lock.json
      - name: Install pinned validator dependencies
        working-directory: kernel
        run: npm ci --ignore-scripts
      - name: Validate downstream adoption
        run: >-
          node kernel/scripts/validate-adoption.mjs
          --downstream-root downstream
          --kernel-root kernel
          --caller-repository "${{ github.repository }}"
          --workflow-repository "${{ job.workflow_repository }}"
          --workflow-path "${{ job.workflow_file_path }}"
          --workflow-sha "${{ job.workflow_sha }}"
      - name: Audit changed public copy
        run: >-
          node kernel/skills/frank-brand-editor/scripts/editorial-audit.mjs
          --root downstream
          --policy kernel/editorial/language-policy.json
          --changed-from "${{ github.event.pull_request.base.sha }}"
          --strict
