name: Starlight editorial contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  editorial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out caller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: downstream
          persist-credentials: false
          fetch-depth: 0
      - name: Check out immutable editorial kernel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: frankxai/starlight-design-intelligence
          ref: ${{ job.workflow_sha }}
          path: kernel
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
      - name: Audit changed public copy
        run: >-
          node kernel/skills/frank-brand-editor/scripts/editorial-audit.mjs
          --root downstream
          --policy kernel/editorial/language-policy.json
          --changed-from "${{ github.event.pull_request.base.sha }}"
          --strict
